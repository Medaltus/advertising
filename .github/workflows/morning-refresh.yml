name: Morning Ad Data Refresh

on:
  schedule:
    # Runs at 7:00 AM ET (11:00 UTC) every day
    - cron: '0 11 * * *'
  workflow_dispatch:  # Lets you trigger it manually from GitHub

jobs:
  # ── Medaltus ─────────────────────────────────────────────────────────────────
  medaltus:
    name: Refresh Medaltus Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests

      - name: Write config.json
        env:
          CONFIG_JSON: ${{ secrets.CONFIGJSON }}
        run: echo "$CONFIG_JSON" > config.json

      - name: Fetch Amazon Ads data
        run: python3 fetch_ads_data.py

      - name: Generate api_supplement.json
        run: python3 generate_supplement.py

      - name: Commit and push Medaltus data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/api_supplement.json
          git diff --cached --quiet || git commit -m "chore: daily Medaltus ad data refresh [skip ci]"
          git push

  # ── Skinuva ──────────────────────────────────────────────────────────────────
  skinuva:
    name: Refresh Skinuva Data
    runs-on: ubuntu-latest
    needs: medaltus   # run after Medaltus so git push doesn't conflict

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main   # always pull the latest (including Medaltus commit above)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests

      # Write the Skinuva Amazon config.
      # If Skinuva has its own Amazon Ads account, create a GitHub secret called
      # SKINUVA_CONFIG_JSON with its credentials and it will be used here.
      # If Skinuva is part of the Medaltus account, set SKINUVA_CONFIG_JSON to
      # the same value as CONFIGJSON (but with "Skinuva" added to the brands list).
      - name: Write Skinuva Amazon config
        env:
          SKINUVA_CONFIG_JSON: ${{ secrets.SKINUVA_CONFIG_JSON }}
        run: |
          if [ -n "$SKINUVA_CONFIG_JSON" ]; then
            echo "$SKINUVA_CONFIG_JSON" > skinuva/config.json
            echo "✓ Using SKINUVA_CONFIG_JSON secret"
          else
            echo "⚠ SKINUVA_CONFIG_JSON secret not set — skipping Amazon fetch"
            echo '{}' > skinuva/config.json
          fi

      # Fetch Skinuva Amazon Ads data → skinuva/ads_data.js
      - name: Fetch Skinuva Amazon Ads data
        run: python3 skinuva/fetch_ads_data.py
        continue-on-error: true   # don't block Google Ads if Amazon creds are missing

      # Convert skinuva/ads_data.js → skinuva/data/skinuva_supplement.json
      - name: Generate skinuva_supplement.json
        run: python3 skinuva/generate_skinuva_supplement.py
        continue-on-error: true

      # Fetch Skinuva Google Ads data → skinuva/data/google_ads_data.json
      - name: Write shared config for Google Ads
        env:
          CONFIG_JSON: ${{ secrets.CONFIGJSON }}
        run: echo "$CONFIG_JSON" > config.json

      - name: Fetch Skinuva Google Ads data
        run: python3 skinuva/fetch_google_ads.py

      - name: Commit and push Skinuva data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skinuva/data/skinuva_supplement.json \
                  skinuva/data/google_ads_data.json
          git diff --cached --quiet || git commit -m "chore: daily Skinuva ad data refresh [skip ci]"
          git push
