name: Morning Ad Data Refresh

on:
  schedule:
    - cron: '0 6 * * *'   # targets ~5am ET (GitHub adds ~3h delay)
    - cron: '0 13 * * *'  # targets ~noon ET (GitHub adds ~3h delay)
  workflow_dispatch:  # Lets you trigger it manually from GitHub

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests

      - name: Write config.json
        env:
          CONFIG_JSON: ${{ secrets.CONFIGJSON }}
        run: |
          echo "$CONFIG_JSON" > config.json
          python3 - <<'PYEOF'
          import json
          with open('config.json') as f:
              c = json.load(f)
          if 'Skinside' not in c['brands']:
              c['brands'].append('Skinside')
          with open('config.json', 'w') as f:
              json.dump(c, f)
          print('brands:', c['brands'])
          PYEOF

      # ── Amazon Ads (shared account — fetches all brands including Skinuva) ──
      - name: Fetch Amazon Ads data
        env:
          LOOKBACK_DAYS: 31
        run: python3 fetch_ads_data.py

      # ── Medaltus ─────────────────────────────────────────────────────────────
      - name: Generate api_supplement.json
        run: python3 generate_supplement.py

      # ── Skinuva ──────────────────────────────────────────────────────────────
      - name: Generate skinuva_supplement.json
        run: python3 skinuva/generate_skinuva_supplement.py
        continue-on-error: true

      - name: Fetch Skinuva Google Ads data
        run: python3 skinuva/fetch_google_ads.py

      # ── Medaltus Internal Google Ads ─────────────────────────────────────────
      - name: Fetch Medaltus Google Ads data
        run: python3 fetch_medaltus_google_ads.py
        continue-on-error: true

      # ── Commit everything ────────────────────────────────────────────────────
      - name: Commit and push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add data/api_supplement.json \
                  data/medaltus_daily_archive.json \
                  data/medaltus_google_ads_monthly.json \
                  skinuva/data/skinuva_supplement.json \
                  skinuva/data/google_ads_data.json \
                  skinuva/data/skinuva_monthly.json \
                  skinuva/data/skinuva_daily_archive.json \
                  skinuva/data/eraclea_supplement.json \
                  skinuva/data/eraclea_monthly.json \
                  skinuva/data/eraclea_daily_archive.json
          git diff --cached --quiet || git commit -m "chore: daily ad data refresh [skip ci]"
          git push
