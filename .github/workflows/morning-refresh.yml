name: Morning Ad Data Refresh

on:
  schedule:
    - cron: '0 6 * * *'   # targets ~5am ET (GitHub adds ~3h delay)
    - cron: '0 13 * * *'  # targets ~noon ET (GitHub adds ~3h delay)
  workflow_dispatch:  # Lets you trigger it manually from GitHub

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests

      # Checkout stamps every file with the checkout time, so anything with a
      # later mtime was genuinely rewritten by a script. Used by the freshness
      # check for files that carry no internal timestamp.
      - name: Mark run start
        run: |
          date +%s > /tmp/run_start_epoch
          # Clear last run's integrity markers so the verify step only reports problems
          # from THIS run. Neither file is committed.
          rm -f data/data_integrity_failures.json data/report_failures.json

      - name: Write config.json
        env:
          CONFIG_JSON: ${{ secrets.CONFIGJSON }}
          SHOPIFY_CONFIG: ${{ secrets.SHOPIFY_CONFIG }}
        run: |
          echo "$CONFIG_JSON" > config.json
          python3 - <<'PYEOF'
          import json, os
          with open('config.json') as f:
              c = json.load(f)
          for b in ('Skinside', 'Cosmette', 'Beautility'):
              if b not in c['brands']:
                  c['brands'].append(b)

          # Amazon Ads profiles are per marketplace. Only the US ones were listed, so
          # the Canada campaigns (Skinuva - SP - Scar/Brite - Auto - CANADA 7.26) were
          # invisible on the dashboard. Merged here rather than added to CONFIGJSON,
          # which is write-only — editing it would mean re-pasting every Amazon and
          # Google credential from scratch.
          #   257626120209879 = NewDerm [CA]
          extra_profiles = [257626120209879]
          pids = c.setdefault('profile_ids', [])
          for pid in extra_profiles:
              if pid not in pids and str(pid) not in [str(x) for x in pids]:
                  pids.append(pid)
                  print('added profile_id:', pid)

          # Fallback FX rate, used only if the live lookup is unreachable. Without a
          # rate the CA profile is dropped entirely rather than having CAD summed into
          # USD totals, so this is what keeps Canada visible if the FX host is down.
          c.setdefault('fx_rates', {}).setdefault('CAD', 0.73)

          # Canada TOTAL SALES. Ad spend alone would measure Canadian spend against a
          # US-only revenue denominator and overstate TACOS. Canada uses its own ASINs
          # (B0H3CLS4XW vs B07RCJDFN4 for the same product), so it gets its own
          # ASIN->brand map; brands still resolve off the SKU prefix (SVA0001-CA).
          #   A2EUQ1WTGCTBG2 = amazon.ca
          mps = c.setdefault('extra_marketplaces', [])
          if not any((m or {}).get('id') == 'A2EUQ1WTGCTBG2' for m in mps):
              mps.append({'id': 'A2EUQ1WTGCTBG2', 'label': 'CA', 'currency': 'CAD'})
              print('added marketplace: CA (A2EUQ1WTGCTBG2)')

          # Shopify credentials live in their OWN secret, merged in here rather
          # than being added to CONFIGJSON. GitHub secrets are write-only: you
          # cannot read an existing value back, so editing CONFIGJSON would mean
          # re-pasting every Amazon/Google credential from scratch and risking
          # losing one. Keeping them separate makes this additive and reversible.
          raw = (os.environ.get('SHOPIFY_CONFIG') or '').strip()
          if raw:
              try:
                  shop = json.loads(raw)
                  c.update(shop)
                  # key names only — never log the values
                  print('shopify keys merged:', sorted(shop.keys()))
              except Exception as e:
                  print('WARNING: SHOPIFY_CONFIG is not valid JSON, ignoring:', e)
          else:
              print('SHOPIFY_CONFIG not set — Shopify fetch will skip, '
                    'manual_totals.json values remain in use')

          with open('config.json', 'w') as f:
              json.dump(c, f)
          print('brands:', c['brands'])
          PYEOF

      # ── Amazon Ads (shared account — fetches all brands including Skinuva) ──
      - name: Fetch Amazon Ads data
        env:
          LOOKBACK_DAYS: 31
        run: python3 fetch_ads_data.py

      # ── Medaltus ─────────────────────────────────────────────────────────────
      - name: Generate api_supplement.json
        run: python3 generate_supplement.py

      # Refunds use the Finances API, not the Reports API — no report quota is
      # consumed, so this cannot contribute to the exhaustion that wiped June's
      # total sales. continue-on-error because a refunds failure must never block
      # the sales data; apply_refunds() preserves existing values when the file is
      # missing, so the dashboard keeps the last good figures.
      - name: Fetch Amazon refunds
        run: python3 fetch_refunds.py --months 3
        continue-on-error: true

      # ── Skinuva ──────────────────────────────────────────────────────────────
      # Must run BEFORE generate_skinuva_supplement.py, which reads
      # shopify_sales.json to build combinedTotalSales.
      - name: Fetch Shopify sales
        run: python3 skinuva/fetch_shopify_sales.py
        continue-on-error: true

      - name: Generate skinuva_supplement.json
        run: python3 skinuva/generate_skinuva_supplement.py
        continue-on-error: true

      - name: Fetch Skinuva Google Ads data
        run: python3 skinuva/fetch_google_ads.py

      # ── Medaltus Internal Google Ads ─────────────────────────────────────────
      - name: Fetch Medaltus Google Ads data
        run: python3 fetch_medaltus_google_ads.py
        continue-on-error: true

      # ── Commit everything ────────────────────────────────────────────────────
      - name: Commit and push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # `git pull --rebase --autostash` is how the dashboards got a 2573.9% TACOS.
          #
          # Two runs overlapping (the 06:00 and 13:00 crons, plus GitHub's 3-4h delay)
          # meant the remote moved while this job was fetching. --autostash stashed the
          # freshly-written data files, rebased, then popped the stash -- and the pop
          # CONFLICTED on skinuva_monthly.json. git left conflict markers in the file,
          # `git add` staged them, and the commit shipped them:
          #
          #     <<<<<<< Updated upstream
          #           "totalSales": 151383.39,
          #     =======
          #           "totalSales": null,
          #     >>>>>>> Stashed changes
          #
          # The file then served HTTP 200 but failed JSON.parse in the browser, the
          # dashboard's silent `.catch(()=>{})` left Skinuva's revenue empty, and TACOS
          # was computed by dividing the whole account's ad spend by eraclea's $1.5K.
          # The run itself was green throughout.
          #
          # These files are all machine-generated and idempotent -- the next run
          # rewrites them from the APIs -- so on conflict the right move is to keep OUR
          # freshly-fetched version wholesale, never a line-level merge. `-X ours` does
          # that during the stash pop, and the explicit conflict check below is the
          # backstop: better to lose one refresh than to publish a corrupt file.
          git pull --rebase --autostash -X ours || {
            echo "::error::git pull --rebase --autostash failed — refusing to commit."
            git rebase --abort 2>/dev/null || true
            exit 1
          }

          # Belt and braces: never commit conflict markers, whatever produced them.
          if grep -rIl --include="*.json" -e '^<<<<<<< ' -e '^>>>>>>> ' data skinuva/data 2>/dev/null | grep .; then
            echo "::error::Conflict markers found in generated data files — NOT committing."
            grep -rIn --include="*.json" -e '^<<<<<<< ' -e '^>>>>>>> ' data skinuva/data | head -20
            exit 1
          fi
          # Stage only files that actually exist this run.
          #
          # Several producing steps are continue-on-error, so any given output
          # can legitimately be absent -- shopify_sales.json in particular isn't
          # written until Shopify credentials are configured. `git add` on a
          # missing pathspec exits 128, and because this step has no
          # continue-on-error that failed the entire run at the very END, after
          # ~50 minutes of successful fetching, silently discarding the refresh.
          DATA_FILES="
            data/api_supplement.json
            data/medaltus_daily_archive.json
            data/medaltus_google_ads_monthly.json
            data/refunds_by_month.json
            skinuva/data/shopify_sales.json
            skinuva/data/walmart_ads.json
            skinuva/data/walmart_revenue.json
            skinuva/data/skinuva_supplement.json
            skinuva/data/google_ads_data.json
            skinuva/data/skinuva_monthly.json
            skinuva/data/skinuva_daily_archive.json
            skinuva/data/eraclea_supplement.json
            skinuva/data/eraclea_monthly.json
            skinuva/data/eraclea_daily_archive.json
          "
          for f in $DATA_FILES; do
            if [ -f "$f" ]; then
              git add "$f"
            else
              echo "::warning::not produced this run, skipping: $f"
            fi
          done
          git diff --cached --quiet || git commit -m "chore: daily ad data refresh [skip ci]"
          git push

      # Runs LAST, and deliberately after the commit: anything that refreshed is
      # already saved, and this then turns any silently-stale dataset into a red
      # run. Without it, a failed continue-on-error step produces a green tick
      # while the dashboards quietly serve yesterday's numbers.
      - name: Verify data actually refreshed
        run: python3 verify_data_freshness.py --run-start-file /tmp/run_start_epoch
