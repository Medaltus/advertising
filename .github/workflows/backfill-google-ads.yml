name: Backfill Skinuva Google Ads Monthly Data

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: false
        default: '2024-07-01'
      end_date:
        description: 'End date (YYYY-MM-DD)'
        required: false
        default: '2026-04-30'

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Write config.json
        env:
          CONFIG_JSON: ${{ secrets.CONFIGJSON }}
        run: echo "$CONFIG_JSON" > config.json

      - name: Run backfill
        run: |
          python3 skinuva/backfill_google_ads_monthly.py \
            --start ${{ github.event.inputs.start_date }} \
            --end   ${{ github.event.inputs.end_date }}

      - name: Commit updated skinuva_monthly.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skinuva/data/skinuva_monthly.json
          git diff --cached --quiet || git commit -m "chore: backfill Skinuva Google Ads historical monthly data"
          git push
